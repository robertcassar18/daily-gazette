<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Daily Maltese, European, international, technology, gadget, and space news digest">
  <title>Daily News Digest</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d1d1d;
      --paper: #f6f1e7;
      --line: #262626;
      --muted: #666;
      --accent: #8d1f1f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: Georgia, "Times New Roman", serif;
    }

    header {
      max-width: 1180px;
      margin: 0 auto;
      padding: 2rem 1rem 1rem;
      text-align: center;
      border-bottom: 4px double var(--line);
    }

    .kicker {
      margin: 0 0 .4rem;
      color: var(--accent);
      font: 700 .8rem/1.2 Arial, sans-serif;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 7vw, 5.5rem);
      line-height: .95;
      text-transform: uppercase;
      letter-spacing: -.04em;
    }

    .subheading {
      margin: .8rem 0 0;
      color: var(--muted);
      font-style: italic;
    }

    .controls {
      max-width: 1180px;
      margin: 1rem auto;
      padding: 0 1rem;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: .7rem;
      font-family: Arial, sans-serif;
    }

    .controls label {
      font-size: .9rem;
      font-weight: 700;
    }

    select {
      max-width: 100%;
      padding: .55rem .7rem;
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      font: inherit;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 1rem 2rem;
    }

    .edition-date {
      margin: 0 0 .75rem;
      color: var(--muted);
      font: .8rem Arial, sans-serif;
      letter-spacing: .08em;
      text-align: right;
      text-transform: uppercase;
    }

    .digest-frame {
      display: block;
      width: 100%;
      min-height: 78vh;
      border: 1px solid var(--line);
      background: white;
    }

    footer {
      max-width: 1180px;
      margin: 0 auto;
      padding: 1rem;
      border-top: 4px double var(--line);
      color: var(--muted);
      font: .8rem/1.5 Arial, sans-serif;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <p class="kicker">The Daily Edition</p>
    <h1>Daily News Digest</h1>
    <p class="subheading">Malta · Europe · World · Technology · Space</p>
  </header>

  <div class="controls">
    <label for="edition">Edition:</label>
    <select id="edition" aria-label="Choose a news edition">
        <option value="daily-2026-08-07.html">Friday, 07 August 2026</option>
    </select>
  </div>

  <main>
    <p class="edition-date" id="edition-date">Edition: 2026-08-07</p>
    <iframe
      class="digest-frame"
      id="digest"
      title="Selected daily news digest"
      src="daily-2026-08-07.html">
    </iframe>
  </main>

  <footer>
    News links lead to the original publishers and sources.
  </footer>

  <script>
    const selector = document.getElementById("edition");
    const digest = document.getElementById("digest");
    const editionDate = document.getElementById("edition-date");

    selector.addEventListener("change", function () {
      const selectedFile = selector.value;
      digest.src = selectedFile;
      editionDate.textContent =
        "Edition: " + selectedFile.replace("daily-", "").replace(".html", "");
      history.replaceState(null, "", "#" + selectedFile);
    });

    const hashFile = decodeURIComponent(location.hash.slice(1));
    if (hashFile && [...selector.options].some(option => option.value === hashFile)) {
      selector.value = hashFile;
      digest.src = hashFile;
      editionDate.textContent =
        "Edition: " + hashFile.replace("daily-", "").replace(".html", "");
    }
  </script>
</body>
</html>
